[[release_critical]]
id = "guest.actual-awman-boot"
suite = "guest-boot"
tests = ["awman-cli::guest boot::actual_awman_boots_a_guest"]
gates = ["main", "candidate"]
not_overridable = true

[[release_critical]]
id = "guest.upgrade-from-previous-release"
suite = "guest-upgrade"
tests = ["awman-cli::guest upgrade::previous_release_state_upgrades_and_boots"]
gates = ["main", "candidate"]
not_overridable = true

[[release_critical]]
id = "guest.strategy-matrix"
suite = "guest-strategy"
# Each case checks the shipped descriptor's settings/prompt/overlay behavior and
# proves that its synthetic agent ran inside a guest, with no host execution.
tests = ["awman-cli::guest strategy::claude_named_skills","awman-cli::guest strategy::claude_all_skills","awman-cli::guest strategy::codex_named_skills","awman-cli::guest strategy::codex_all_skills","awman-cli::guest strategy::opencode_named_skills","awman-cli::guest strategy::opencode_all_skills","awman-cli::guest strategy::gemini_named_skills","awman-cli::guest strategy::gemini_all_skills","awman-cli::guest strategy::copilot_named_skills","awman-cli::guest strategy::copilot_all_skills","awman-cli::guest strategy::cline_named_skills","awman-cli::guest strategy::cline_all_skills","awman-cli::guest strategy::antigravity_named_skills","awman-cli::guest strategy::antigravity_all_skills"]
gates = ["main", "candidate"]
not_overridable = true

[[release_critical]]
id = "artifact.signed-offline-session"
suite = "artifact-signed-boot"
tests = ["awman-cli::artifact signed_boot::signed_artifact_runs_an_offline_session", "awman-cli::artifact signed_boot::signed_artifact_upgrades_previous_state_offline"]
gates = ["candidate"]
not_overridable = true

