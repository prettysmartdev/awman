# WI 0144 target contract. Pending fixture pins are deliberately red, never fake hashes.
schema = 1
quarantine = []
override = []

[tools.nextest]
version = "0.9.150"
source = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.150"
sha256 = { aarch64-unknown-linux-gnu = "9164568e9840c6509177086828ac7d3178c2d8feb0658b4d2bff62fa620e98c8", x86_64-unknown-linux-gnu = "b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f", universal-apple-darwin = "82a759b4d218d38359424196ab244c470e8f7c7d149c814fbbeef4d67c3c301a", x86_64-pc-windows-msvc = "6fd8f9ba48c946a79a5bcdd35bf4f922447b149f7ca6c3ff7f39e12f32ef78db" }

# shellcheck publishes no checksum file: these are the SHA-256 of the release
# assets as downloaded on 2026-11-11 (maintainer cross-check recorded in the ledger).
[tools.shellcheck]
version = "0.11.0"
source = "https://github.com/koalaman/shellcheck"
sha256 = { x86_64-unknown-linux-gnu = "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198", aarch64-unknown-linux-gnu = "12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588", aarch64-apple-darwin = "56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79", x86_64-apple-darwin = "3c89db4edcab7cf1c27bff178882e0f6f27f7afdf54e859fa041fca10febe4c6" }

# From the published actionlint_1.7.7_checksums.txt.
[tools.actionlint]
version = "1.7.7"
source = "https://github.com/rhysd/actionlint"
sha256 = { x86_64-unknown-linux-gnu = "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757", aarch64-unknown-linux-gnu = "401942f9c24ed71e4fe71b76c7d638f66d8633575c4016efd2977ce7c28317d0", aarch64-apple-darwin = "2693315b9093aeacb4ebd91a993fea54fc215057bf0da2659056b4bc033873db", x86_64-apple-darwin = "28e5de5a05fc558474f638323d736d822fff183d2d492f0aecb2b73cc44584f5" }

# crates.io tools: `cargo install --locked --version <pin>`; the registry
# index checksum verifies the crate, so there is no per-platform digest.
[tools.cargo-deny]
version = "0.19.0"
source = "https://crates.io/crates/cargo-deny"
sha256 = {  }

[tools.cargo-llvm-cov]
version = "0.6.21"
source = "https://crates.io/crates/cargo-llvm-cov"
sha256 = {  }

[tools.cargo-mutants]
version = "25.3.1"
source = "https://crates.io/crates/cargo-mutants"
sha256 = {  }

[capabilities.tempdir]
description = "private temporary directory"

[capabilities.loopback]
description = "private loopback TCP and Unix sockets"

[capabilities.subprocess]
description = "owned child processes"

[capabilities.awman-binary]
description = "immutable debug awman"

[capabilities.fake-cli]
description = "owned fake command executable"

[capabilities.local-git]
description = "Git in private repositories"

[capabilities.docker]
description = "private Docker Engine"

[capabilities.local-registry]
description = "loopback registry"

[capabilities.git-transports]
description = "loopback SSH and HTTP Git"

[capabilities.apple-containers]
description = "private Apple Containers service"

[capabilities.docker-sbx]
description = "Docker sandbox CLI"

[capabilities.hypervisor]
description = "HVF or KVM"

[capabilities.builtin-payload]
description = "verified builtin payload"

[capabilities.guest-fixtures]
description = "pinned guest OCI archive"

[capabilities.previous-release]
description = "pinned previous release"

[capabilities.release-artifact]
description = "known digest release executable"

[capabilities.offline]
description = "enforced offline network"

[capabilities.public-network]
description = "public registry access"

[capabilities.registry-credentials]
description = "private registry credentials"

[tiers.unit]
budget_seconds = 1
guarantees = ["tempdir"]

[tiers.component]
budget_seconds = 20
guarantees = ["tempdir", "loopback", "subprocess", "awman-binary", "fake-cli", "local-git"]

[tiers.boundary]
budget_seconds = 120
guarantees = ["tempdir", "loopback", "subprocess", "awman-binary", "fake-cli", "local-git"]
allowed_capabilities = ["docker", "local-registry", "git-transports", "apple-containers", "docker-sbx", "guest-fixtures"]

[tiers.guest]
budget_seconds = 300
guarantees = ["tempdir", "loopback", "subprocess", "awman-binary", "hypervisor", "builtin-payload", "guest-fixtures", "previous-release"]
allowed_capabilities = ["docker", "apple-containers"]

[tiers.artifact]
budget_seconds = 300
guarantees = ["tempdir", "loopback", "subprocess", "release-artifact"]
allowed_capabilities = ["hypervisor", "guest-fixtures", "previous-release", "offline"]

[tiers.soak]
guarantees = ["tempdir", "loopback", "subprocess", "awman-binary"]
allowed_capabilities = ["docker", "hypervisor", "guest-fixtures", "public-network", "registry-credentials"]

[features.default]
cargo_args = []

[features.builtin]
cargo_args = ["--features", "builtin-runtime,guest-drivers"]

[platforms.linux-x64]
toolchain = "1.94.0"
trust = "hosted"
runs_on = ["ubuntu-24.04"]
triple = "x86_64-unknown-linux-gnu"
image = "20261101.360"
provides = ["tempdir", "loopback", "subprocess", "awman-binary", "fake-cli", "local-git", "docker", "local-registry", "git-transports", "release-artifact", "public-network"]

