reserved_namespace_identifier = "AWMAN_TEST_PREFIX"
reserved_agent_countdown = "AWMAN_TEST_AGENT_DONE_COUNTDOWN_MS"
reserved_yolo_countdown = "AWMAN_TEST_YOLO_COUNTDOWN_MS"
test_apple_image = "AWMAN_TEST_APPLE_IMAGE"
test_apple_keep_archive = "AWMAN_TEST_APPLE_KEEP_ARCHIVE"
