test_embedded_child = "AWMAN_TEST_EMBEDDED_RESOLUTION_CHILD"
test_process_overlay = "AWMAN_TEST_PROCESS_OVERLAY_ONLY"
test_sbx_overlay = "AWMAN_TEST_SBX_OVERLAY_ONLY"
