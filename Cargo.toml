[workspace]
members = [".", "crates/awman-cli", "crates/awman-host-shims"]
default-members = [".", "crates/awman-cli", "crates/awman-host-shims"]
resolver = "2"

[workspace.package]
version = "0.12.0"

[package]
name = "awman"
version.workspace = true
edition = "2021"
rust-version = "1.94.0"
description = "A containerized code agent manager"
# The binary and registered integration tests belong to awman-cli. This
# package owns only the Layer 0–3 library and its unit tests.
autotests = false
autobins = false
autoexamples = false

[lib]
name = "awman"
path = "src/lib.rs"

[features]
default = []
builtin-runtime = ["dep:microsandbox", "dep:microsandbox-cli", "dep:microsandbox-image", "dep:microsandbox-network", "dep:sqlx", "dep:msb_krun", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:hyper-rustls"]

[dependencies]
anyhow = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "7"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
strip-ansi-escapes = "0.2"
strsim = "0.11"
tempfile = "3"
vt100 = { package = "vt100-ctt", version = "0.17", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13", features = ["rustls", "json", "stream", "blocking"], default-features = false }
tokio-stream = "0.1"
unicode-width = "0.2"
flate2 = "1"
tar = "0.4"
sha2 = "0.11"
arboard = "3"
shell-words = "1"
toml = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tower-http = { version = "0.7", features = ["trace"] }
chrono = { version = "0.4", features = ["serde"] }
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
subtle = "2"
thiserror = "2"
async-trait = "0.1"
futures-util = "0.3"
which = "8"
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "rustls-native-certs"], optional = true }

[build-dependencies]
sha2 = "0.11"
toml = "1"

[target.'cfg(any(all(target_os = "macos", target_arch = "aarch64"), all(target_os = "linux", target_env = "gnu", any(target_arch = "aarch64", target_arch = "x86_64"))))'.dependencies]
microsandbox = { version = "=0.7.2", default-features = false, features = ["local", "net"], optional = true }
microsandbox-cli = { version = "=0.7.2", default-features = false, features = ["net", "embed-binaries"], optional = true }
microsandbox-image = { version = "=0.7.2", optional = true }
microsandbox-network = { version = "=0.7.2", default-features = false, features = ["engine"], optional = true }
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"], optional = true }
msb_krun = { version = "=0.1.39", optional = true }

[patch.crates-io]
sqlx-sqlite = { path = "third_party/sqlx-sqlite-0.9.0" }
msb_krun = { path = "third_party/msb_krun-0.1.39" }
microsandbox-filesystem = { path = "third_party/microsandbox-filesystem-0.7.2" }
microsandbox = { path = "third_party/microsandbox-0.7.2" }
microsandbox-network = { path = "third_party/microsandbox-network-0.7.2" }
microsandbox-types = { path = "third_party/microsandbox-types-0.7.2" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "fs", "poll", "user"] }
libc = "0.2"

[dev-dependencies]
reqwest = { version = "0.13", features = ["rustls", "json"], default-features = false }
wiremock = "0.6"
