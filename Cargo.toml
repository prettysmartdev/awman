[workspace]
members = [".", "crates/awman-cli", "crates/awman-host-shims"]
default-members = [".", "crates/awman-cli", "crates/awman-host-shims"]
resolver = "2"

[workspace.package]
version = "0.12.0"

# Shared dependency versions for every workspace member. Members inherit with
# `dep = { workspace = true, ... }` and add only `optional` and extra
# `features` (features are additive). Entries that disable default features
# here stay disabled in every member, so only list `default-features = false`
# where every member wants it.
[workspace.dependencies]
# Path dependencies between members.
awman = { path = "." }
awman-host-shims = { path = "crates/awman-host-shims" }

anyhow = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "7"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
strip-ansi-escapes = "0.2"
strsim = "0.11"
tempfile = "3"
vt100 = { package = "vt100-ctt", version = "0.17", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
# Base feature set shared by normal and dev dependencies; normal dependencies
# add `stream` and `blocking`.
reqwest = { version = "0.13", features = ["rustls", "json"], default-features = false }
tokio-stream = "0.1"
unicode-width = "0.2"
flate2 = "1"
tar = "0.4"
sha2 = "0.11"
arboard = "3"
shell-words = "1"
toml = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tower-http = { version = "0.7", features = ["trace"] }
chrono = { version = "0.4", features = ["serde"] }
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
subtle = "2"
thiserror = "2"
async-trait = "0.1"
futures-util = "0.3"
which = "8"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "rustls-native-certs"] }
# Features vary per member (each adds its own).
nix = "0.31"
libc = "0.2"
wiremock = "0.6"

# Built-in runtime SDK pins. These exact versions must match `MSB_VERSION` in
# `src/data/builtin_runtime.rs` and the vendored crates under `third_party/`;
# a unit test there checks this table.
microsandbox = { version = "=0.7.2", default-features = false, features = ["local", "net"] }
microsandbox-cli = { version = "=0.7.2", default-features = false, features = ["net", "embed-binaries"] }
microsandbox-image = { version = "=0.7.2" }
microsandbox-network = { version = "=0.7.2", default-features = false, features = ["engine"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
msb_krun = { version = "=0.1.39" }

[package]
name = "awman"
version.workspace = true
edition = "2021"
rust-version = "1.94.0"
description = "A containerized code agent manager"
# The binary and registered integration tests belong to awman-cli. This
# package owns only the Layer 0–3 library and its unit tests.
autotests = false
autobins = false
autoexamples = false

[lib]
name = "awman"
path = "src/lib.rs"

[features]
default = []
builtin-runtime = ["dep:microsandbox", "dep:microsandbox-cli", "dep:microsandbox-image", "dep:microsandbox-network", "dep:sqlx", "dep:msb_krun", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:hyper-rustls"]

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }
portable-pty = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
strip-ansi-escapes = { workspace = true }
strsim = { workspace = true }
tempfile = { workspace = true }
vt100 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true, features = ["stream", "blocking"] }
tokio-stream = { workspace = true }
unicode-width = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
sha2 = { workspace = true }
arboard = { workspace = true }
shell-words = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { workspace = true }
chrono = { workspace = true }
rcgen = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
which = { workspace = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper-rustls = { workspace = true, optional = true }

[build-dependencies]
sha2 = { workspace = true }
toml = { workspace = true }

[target.'cfg(any(all(target_os = "macos", target_arch = "aarch64"), all(target_os = "linux", target_env = "gnu", any(target_arch = "aarch64", target_arch = "x86_64"))))'.dependencies]
microsandbox = { workspace = true, optional = true }
microsandbox-cli = { workspace = true, optional = true }
microsandbox-image = { workspace = true, optional = true }
microsandbox-network = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
msb_krun = { workspace = true, optional = true }

[patch.crates-io]
sqlx-sqlite = { path = "third_party/sqlx-sqlite-0.9.0" }
msb_krun = { path = "third_party/msb_krun-0.1.39" }
microsandbox-filesystem = { path = "third_party/microsandbox-filesystem-0.7.2" }
microsandbox = { path = "third_party/microsandbox-0.7.2" }
microsandbox-network = { path = "third_party/microsandbox-network-0.7.2" }
microsandbox-types = { path = "third_party/microsandbox-types-0.7.2" }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process", "fs", "poll", "user"] }
libc = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
wiremock = { workspace = true }
