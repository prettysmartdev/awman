# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: awman Antigravity
description: Antigravity launched and policed by awman
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - generativelanguage.googleapis.com:443
  - type: com.docker.sandbox/credential@1
    description: google API access for Antigravity
    config:
      service: google
      phase: runtime
      apiKey:
        name: GEMINI_API_KEY
        proxyManaged: true
        inject:
          - domain: generativelanguage.googleapis.com
            header: x-goog-api-key
            format: "%s"
