# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: awman OpenCode 1
description: OpenCode 1 launched and policed by awman
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.anthropic.com:443
  - type: com.docker.sandbox/credential@1
    description: anthropic API access for OpenCode 1
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - domain: api.anthropic.com
            header: x-api-key
            format: "%s"
