# awman-generated Docker Sandbox kit — agent: opencode-v2 (kind: agent)
# Rendered by DSbxKitEmitter at awman ready; update this reviewed template to change pins.
# awman version: {{AWMAN_VERSION}}
schemaVersion: "1"
kind: agent
name: awman-opencode-v2
displayName: awman (OpenCode 2)
description: awman-managed opencode-v2 sandbox, CLI 2.3.2
agent:
  image: docker/sandbox-templates:shell-docker
  entrypoint:
    run:
      - opencode
      - --standalone
  persistence: persistent
network:
  allowedDomains:
    - api.anthropic.com
    - registry.npmjs.org
    - github.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
credentials:
  sources:
    anthropic:
      env:
        - ANTHROPIC_API_KEY
environment:
  proxyManaged:
    - ANTHROPIC_API_KEY
agentContext: |
  This sandbox is orchestrated by awman {{AWMAN_VERSION}} using the
  Docker Sandboxes (experimental) runtime. Per-launch configuration is read
  from ${WORKDIR}/.awman/session.json by the startup script.
commands:
  install:
    - command: |
        set -euo pipefail
        OC_VERSION=2.3.2
        case "$(uname -m)" in
          x86_64|amd64)  OC_ARCH=x64 ;;
          aarch64|arm64) OC_ARCH=arm64 ;;
          *) echo "awman: opencode-v2 ${OC_VERSION} has no Linux package for architecture '$(uname -m)' (supported: x86_64, aarch64)" >&2; exit 1 ;;
        esac
        # Capture ldd output first: musl ldd may exit nonzero when printing its version.
        OC_LDD="$(ldd --version 2>&1 || true)"
        case "$OC_LDD" in *musl*) OC_LIBC=-musl ;; *) OC_LIBC= ;; esac
        case "${OC_ARCH}${OC_LIBC}" in
          x64) OC_SHA=563b5d663637226b6e3bb4bb6803281bc39b0d2cd88db06d674b6420aab009b0 ;;
          arm64) OC_SHA=9d10185acdb72336e086e699ca363a6065f410fd3c1caed0dc8046e95ac06ccb ;;
          x64-musl) OC_SHA=4e952a67874cfdb4f53eeae5840f9813acc9f109c10e61bc26020271f56d7d84 ;;
          arm64-musl) OC_SHA=2148ba748f5410177868ed67d59ef70626cb6bd4fb2abc5177c807adfdc24fc3 ;;
        esac
        OC_ASSET="opencode-linux-${OC_ARCH}${OC_LIBC}.tar.gz"
        curl -fsSL --retry 5 --retry-delay 2 --retry-max-time 300 -o "/tmp/${OC_ASSET}" \
          "https://github.com/anomalyco/opencode/releases/download/v${OC_VERSION}/${OC_ASSET}" \
          || { echo "awman: opencode-v2 ${OC_VERSION} could not download Linux package ${OC_ASSET} for ${OC_ARCH}${OC_LIBC}" >&2; exit 1; }
        echo "${OC_SHA}  /tmp/${OC_ASSET}" | sha256sum -c -
        tar -xzf "/tmp/${OC_ASSET}" -C /tmp opencode
        install -m 0755 /tmp/opencode /usr/local/bin/opencode
        rm -f /tmp/opencode "/tmp/${OC_ASSET}"
        # Assert as the runtime user, without inheriting installation credentials.
        runuser -u agent -- env -i HOME=/home/agent PATH=/usr/local/bin:/usr/bin:/bin bash -eo pipefail -c '
        v="$(opencode --version 2>/dev/null | grep -Eo '\''[0-9]+\.[0-9]+\.[0-9]+'\'' | head -n 1)" || v=
        [ "$v" = "2.3.2" ] \
          || { echo "awman: expected opencode 2.3.2 (2.x) in this image, found '\''${v:-nothing}'\''" >&2; exit 1; }
        '
      description: Install and verify pinned opencode-v2 2.3.2
  startup:
    - command: ["bash", "/home/agent/.awman/apply-session-config.sh"]
      description: Apply awman per-launch session config
