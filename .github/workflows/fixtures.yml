name: Fixtures
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New immutable fixtures-* release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: fixtures-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ startsWith(github.ref, 'refs/heads/release/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.94.0'
      - name: Resolve the fixture publication plan
        run: cargo xtask fixtures publish-plan > fixture-plan.json
      - name: Build the reviewed immutable guest fixture
        run: |
          BASE_IMAGE=$(cat ci/fixture-base-image.txt)
          [[ "$BASE_IMAGE" =~ ^alpine@sha256:[0-9a-f]{64}$ ]] || exit 1
          docker pull --platform linux/arm64 "$BASE_IMAGE"
          docker image save --output base.tar "$BASE_IMAGE"
          BASE_SHA256=$(sha256sum base.tar | cut -d ' ' -f 1)
          mkdir -p out
          cargo xtask fixtures build guest-oci-base --base base.tar --sha256 "$BASE_SHA256" --out built
          cargo xtask fixtures verify-build --base base.tar --sha256 "$BASE_SHA256" --out built
          printf '%s\n' "$BASE_IMAGE" > out/base-image.txt
          cp built/fixture-oci.tar built/fixture-docker.tar built/provenance.json out/
          (cd out && sha256sum fixture-oci.tar fixture-docker.tar provenance.json base-image.txt > SHA256SUMS)
          cp fixture-plan.json out/
      - name: Attest the exact fixture archives and reproduction record
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/fixture-oci.tar
            out/fixture-docker.tar
            out/provenance.json
            out/base-image.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/heads/release/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixture-${{ github.run_id }}
          path: out
      - name: Publish once and retain the exact digest for the manifest review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          [ "$TAG" = "fixtures-$COMMIT" ] || { echo 'Fixture tag must bind the source commit' >&2; exit 1; }
          (cd out && sha256sum -c SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing fixture release' >&2
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo 'Refusing an existing remote fixture tag' >&2
            exit 1
          fi
          gh release create "$TAG" --target "$COMMIT" --title "$TAG" --prerelease --latest=false --notes-file out/SHA256SUMS out/*
          cat out/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo 'P7 remains open until the downloaded public bytes and all previous-release assets are verified and committed in ci/gates.toml.' >> "$GITHUB_STEP_SUMMARY"
