            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}
      - name: Install the pinned test runner
        run: cargo xtask test install-runner
      - name: Build the nextest archive and the debug binary
        run: cargo xtask test archive --build macos-arm64-ci-guest-builtin --out archive
      - name: Record digests
        id: digests
        run: |
          cp "target/debug/awman$(if [ "$RUNNER_OS" = Windows ]; then echo .exe; fi)" archive/awman-debug-macos-arm64-ci-guest-builtin
          cargo xtask ci digest record --out archive/digests.json \
            archive=archive/test-archive-macos-arm64-ci-guest-builtin.tar.zst \
            expected=archive/expected-tests-macos-arm64-ci-guest-builtin.json \
            binary=archive/awman-debug-macos-arm64-ci-guest-builtin >> "$GITHUB_OUTPUT"
      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
