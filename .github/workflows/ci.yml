          CACHE_KEY: ${{ steps.cache-key.outputs.key }}
        run: cargo xtask ci cache-stats --build macos-arm64-ci-guest-builtin --key "$CACHE_KEY" --hit "${CACHE_HIT:-false}" --out cache-stats
      - name: Upload cache statistics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ needs.plan.outputs.gate }}-${{ inputs.mode }}-cache-macos-arm64-ci-guest-builtin
          path: cache-stats
          if-no-files-found: warn
          retention-days: 30
      - name: Save the cache (main pushes only)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}
      - name: Leak sweep
        if: ${{ always() }}
        run: cargo xtask ci sweep

  build-macos-arm64-default:
    name: Build macos-arm64-default
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.builds), 'macos-arm64-default') }}
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      archive_sha256: ${{ steps.digests.outputs.archive_sha256 }}
      expected_sha256: ${{ steps.digests.outputs.expected_sha256 }}
      binary_sha256: ${{ steps.digests.outputs.binary_sha256 }}
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
