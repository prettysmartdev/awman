    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.hardware != 'true' && (contains(fromJSON(needs.plan.outputs.jobs), 'test-boundary-macos-arm64-ci-guest') || contains(fromJSON(needs.plan.outputs.jobs), 'test-boundary-macos-arm64-sbx') || contains(fromJSON(needs.plan.outputs.jobs), 'test-component-macos-arm64-ci-guest') || contains(fromJSON(needs.plan.outputs.jobs), 'test-guest-macos-arm64-ci-guest') || contains(fromJSON(needs.plan.outputs.jobs), 'test-soak-macos-arm64-ci-guest')) }}
