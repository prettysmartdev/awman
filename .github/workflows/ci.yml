          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"
      - name: Compute the cache key
        id: cache-key
        run: echo "key=$(cargo xtask ci cache-key --build linux-x64-default)" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo and build cache (exact key, no fallback)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}
      - name: Install the pinned test runner
        run: cargo xtask test install-runner
      - name: Build the nextest archive and the debug binary
        run: cargo xtask test archive --build linux-x64-default --out archive
      - name: Record digests
        id: digests
        run: |
          cp "target/debug/awman$(if [ "$RUNNER_OS" = Windows ]; then echo .exe; fi)" archive/awman-debug-linux-x64-default
          cargo xtask ci digest record --out archive/digests.json \
            archive=archive/test-archive-linux-x64-default.tar.zst \
            expected=archive/expected-tests-linux-x64-default.json \
            binary=archive/awman-debug-linux-x64-default >> "$GITHUB_OUTPUT"
      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-archive-${{ needs.plan.outputs.gate }}-${{ inputs.mode }}-linux-x64-default
          path: archive
          if-no-files-found: error
          retention-days: 7
      - name: Record cache statistics
        if: ${{ always() }}
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.cache-key.outputs.key }}
        run: cargo xtask ci cache-stats --build linux-x64-default --key "$CACHE_KEY" --hit "${CACHE_HIT:-false}" --out cache-stats
      - name: Upload cache statistics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ needs.plan.outputs.gate }}-${{ inputs.mode }}-cache-linux-x64-default
          path: cache-stats
          if-no-files-found: warn
          retention-days: 30
      - name: Save the cache (main pushes only)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}

  static-musl:
    name: Build linux-x64-musl-static
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.builds), 'linux-x64-musl-static') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"
          targets: x86_64-unknown-linux-musl
      - name: Compute the cache key
        id: cache-key
        run: echo "key=$(cargo xtask ci cache-key --build linux-x64-musl-static)" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo and build cache (exact key, no fallback)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}
      - name: Install the static C toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build the distribution executable (x86_64-unknown-linux-musl)
        run: cargo build -p awman-cli --bin awman --release --locked --target x86_64-unknown-linux-musl 
      - name: Smoke test the static executable
        run: |
          artifact=target/x86_64-unknown-linux-musl/release/awman
          "$artifact" --version
          if readelf -l "$artifact" | grep -q INTERP; then
            echo 'expected a static executable without a dynamic loader' >&2
            exit 1
          fi
      - name: Record cache statistics
        if: ${{ always() }}
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.cache-key.outputs.key }}
        run: cargo xtask ci cache-stats --build linux-x64-musl-static --key "$CACHE_KEY" --hit "${CACHE_HIT:-false}" --out cache-stats
      - name: Upload cache statistics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ needs.plan.outputs.gate }}-${{ inputs.mode }}-cache-linux-x64-musl-static
          path: cache-stats
          if-no-files-found: warn
          retention-days: 30
      - name: Save the cache (main pushes only)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}

  build-macos-arm64-ci-guest-builtin:
    name: Build macos-arm64-ci-guest-builtin
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.builds), 'macos-arm64-ci-guest-builtin') && needs.plan.outputs.hardware == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    runs-on: [self-hosted, macOS, ARM64, awman-ci-guest]
    timeout-minutes: 30
    outputs:
      archive_sha256: ${{ steps.digests.outputs.archive_sha256 }}
      expected_sha256: ${{ steps.digests.outputs.expected_sha256 }}
      binary_sha256: ${{ steps.digests.outputs.binary_sha256 }}
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"
      - name: Runner health (blocked early, never queued forever)
        run: cargo xtask ci runner-preflight --platform macos-arm64-ci-guest
      - name: Compute the cache key
        id: cache-key
        run: echo "key=$(cargo xtask ci cache-key --build macos-arm64-ci-guest-builtin)" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo and build cache (exact key, no fallback)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
