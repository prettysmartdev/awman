# GENERATED by `cargo xtask gates render` from ci/gates.toml. DO NOT EDIT BY HAND:
# `cargo xtask gates check` rejects any difference from the rendered text.
# Change the manifest or xtask/src/gates/render/workflows/, then re-render.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate:
        description: Gate to run (hardware jobs only ever run from main)
        type: choice
        options: [pr, main, nightly]
        default: pr
  workflow_call:
    inputs:
      gate:
        description: "pr, main or nightly"
        type: string
        default: pr
      ref:
        description: Commit to check out and gate (empty means the triggering commit)
        type: string
        default: ""
      mode:
        description: "gate, or a nightly mode run over the same build and test jobs"
        type: string
        default: gate
    outputs:
      verdict:
        description: passed, failed or blocked
        value: ${{ jobs.gate.outputs.verdict }}

# Read-only by default; no job in this file holds a write scope.
permissions:
  contents: read

# Only superseded pull-request runs are cancelled: main, merge-queue, nightly
# and called runs always finish so their evidence exists.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.gate }}-${{ inputs.mode }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      gate: ${{ steps.gate.outputs.gate }}
      builds: ${{ steps.outputs.outputs.builds }}
      jobs: ${{ steps.outputs.outputs.jobs }}
      shards: ${{ steps.outputs.outputs.shards }}
      hardware: ${{ steps.hardware.outputs.hardware }}
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"
      - name: Resolve the gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          INPUT_GATE: ${{ inputs.gate }}
        run: |
          case "$EVENT" in
            pull_request|merge_group) gate=pr ;;
            push) gate=main ;;
            *) gate="${INPUT_GATE:-pr}" ;;
          esac
          case "$gate" in
            pr|main|nightly) ;;
            *) echo "unknown gate: $gate" >&2; exit 1 ;;
          esac
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
      - name: Validate the manifest and every generated file
        run: cargo xtask gates check
      - name: Hardware admission (trusted refs only)
        id: hardware
        env:
          GATE: ${{ steps.gate.outputs.gate }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUESTED_REF: ${{ inputs.ref }}
          SHA: ${{ github.sha }}
          RUNNER_ENABLED: ${{ vars.AWMAN_CI_GUEST_RUNNER }}
        run: |
          # Self-hosted CI hardware is reachable only from a protected-main
          # push, schedule or dispatch of the trusted gate on the commit that
          # triggered the run. Pull requests, merge groups (even from forks),
          # other refs and ref overrides never get it. The runner group's own
          # repository/workflow restriction is the server-side half (P1/P3).
          hardware=false
          case "$EVENT" in
            push|schedule|workflow_dispatch) ;;
            *) EVENT_OK=no ;;
          esac
          if [ "${EVENT_OK:-yes}" = yes ] \
            && [ "$GATE" != pr ] \
            && [ "$REF" = refs/heads/main ] \
            && { [ -z "$REQUESTED_REF" ] || [ "$REQUESTED_REF" = "$SHA" ]; } \
            && [ "$RUNNER_ENABLED" = enabled ]; then
            hardware=true
          fi
          echo "hardware=$hardware" >> "$GITHUB_OUTPUT"
      - name: Load recorded timings (diagnostic input to shard counts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p trends
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name ci-trends --dir trends 2>/dev/null; then
            echo "using timings from nightly run $run_id"
          else
            echo "no recorded timings yet; every suite plans as one shard"
          fi
      - name: Plan the gate
        env:
          GATE: ${{ steps.gate.outputs.gate }}
          EVENT: ${{ github.event_name }}
          REPOSITORY_ID: ${{ github.repository_id }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ inputs.ref || github.sha }}
        run: |
          base="${PR_BASE:-${MG_BASE:-$PUSH_BASE}}"
          case "$base" in 0000000000000000000000000000000000000000) base= ;; esac
          args=(--gate "$GATE" --event "$EVENT" --repository-id "$REPOSITORY_ID" --head "$HEAD_SHA" --json plan.json)
          if [ -n "$base" ]; then args+=(--base "$base"); fi
          if [ -f trends/timings.json ]; then args+=(--timings trends/timings.json); fi
          cargo xtask gates plan "${args[@]}"
      - name: Publish plan outputs
        id: outputs
        env:
          HARDWARE: ${{ steps.hardware.outputs.hardware }}
        run: cargo xtask ci plan-outputs --plan plan.json --hardware "$HARDWARE" >> "$GITHUB_OUTPUT"
      - name: Upload the plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ steps.gate.outputs.gate }}-${{ inputs.mode }}-${{ github.sha }}
          path: plan.json
          if-no-files-found: error
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GATE_NAME: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'merge_group' && 'pr' || github.event_name == 'push' && 'main' || inputs.gate || 'pr' }}
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
      - name: Compute the cache key
        id: cache-key
        run: echo "key=$(cargo xtask ci cache-key --build linux-x64-default --scope lint)" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo and build cache (exact key, no fallback)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}
      - name: Install pinned tools (shellcheck, actionlint, cargo-deny)
        run: |
          cargo xtask ci install-tool shellcheck
          cargo xtask ci install-tool actionlint
          cargo xtask ci install-tool cargo-deny
      - name: Workflows (actions pinned to SHAs, timeouts, actionlint)
        if: ${{ !cancelled() }}
        run: |
          cargo xtask ci actionlint-config --out "$RUNNER_TEMP/actionlint.yaml"
          actionlint -config-file "$RUNNER_TEMP/actionlint.yaml" -color
      - name: Acceptance inventory
        run: cargo xtask matrix check
      - name: Lint suites with evidence (9)
        if: ${{ !cancelled() }}
        run: cargo xtask test run --suite "lint-fmt,lint-clippy,lint-architecture,lint-hygiene,lint-shell,lint-workflows,lint-deny,lint-notice,doctests" --build linux-x64-default --evidence-dir evidence
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ env.GATE_NAME }}-${{ inputs.mode }}-lint
          path: evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Save the cache (main pushes only)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}

  build-linux-arm64-builtin:
    name: Build linux-arm64-builtin
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.builds), 'linux-arm64-builtin') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      archive_sha256: ${{ steps.digests.outputs.archive_sha256 }}
      expected_sha256: ${{ steps.digests.outputs.expected_sha256 }}
      binary_sha256: ${{ steps.digests.outputs.binary_sha256 }}
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"
      - name: Compute the cache key
        id: cache-key
        run: echo "key=$(cargo xtask ci cache-key --build linux-arm64-builtin)" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo and build cache (exact key, no fallback)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}
      - name: Install the pinned test runner
        run: cargo xtask test install-runner
      - name: Build the nextest archive and the debug binary
        run: cargo xtask test archive --build linux-arm64-builtin --out archive
      - name: Record digests
        id: digests
        run: |
          cp "target/debug/awman$(if [ "$RUNNER_OS" = Windows ]; then echo .exe; fi)" archive/awman-debug-linux-arm64-builtin
          cargo xtask ci digest record --out archive/digests.json \
            archive=archive/test-archive-linux-arm64-builtin.tar.zst \
            expected=archive/expected-tests-linux-arm64-builtin.json \
            binary=archive/awman-debug-linux-arm64-builtin >> "$GITHUB_OUTPUT"
      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-archive-${{ needs.plan.outputs.gate }}-${{ inputs.mode }}-linux-arm64-builtin
          path: archive
          if-no-files-found: error
          retention-days: 7
      - name: Record cache statistics
        if: ${{ always() }}
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.cache-key.outputs.key }}
        run: cargo xtask ci cache-stats --build linux-arm64-builtin --key "$CACHE_KEY" --hit "${CACHE_HIT:-false}" --out cache-stats
      - name: Upload cache statistics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ needs.plan.outputs.gate }}-${{ inputs.mode }}-cache-linux-arm64-builtin
          path: cache-stats
          if-no-files-found: warn
          retention-days: 30
      - name: Save the cache (main pushes only)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}

  build-linux-x64-default:
    name: Build linux-x64-default
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.builds), 'linux-x64-default') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive_sha256: ${{ steps.digests.outputs.archive_sha256 }}
