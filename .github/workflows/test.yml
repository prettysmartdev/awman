name: Tests

on:
  # Branch pushes are covered by `pull_request`, which tests the merge result
  # (and also runs the Windows job); a `push` run there would duplicate it.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  fast:
    name: Fast checks (lint, fmt, clippy, hermetic tests)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fast-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fast-v2-

      - name: Architecture lint
        run: make architecture-lint

      - name: Release runner script
        run: |
          bash -n scripts/release.sh tools/release-runner.sh tools/test-release-runner.sh tools/apple-silicon-prerelease.sh tools/prerelease-ci-gate.sh tools/test-prerelease-ci-gate.sh
          bash tools/test-release-runner.sh
          bash tools/test-prerelease-ci-gate.sh

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Hermetic tests
        run: make test-fast

  full-linux-docker:
    name: Full tests with Docker (Linux)
    runs-on: ubuntu-26.04
    needs: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-full-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-full-v2-

      - name: Verify Docker is available
        run: docker info

      - name: Full test suite (real Docker, real git)
        run: make test-full

  web:
    name: Web app, edge Worker and browser acceptance
    runs-on: ubuntu-24.04
    needs: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-web-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-web-v1-

      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"

      - name: Install npm 11
        run: npm install --global npm@11.17.0

      - name: Install pinned web dependencies
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web/edge ci --ignore-scripts
          npm --prefix web/e2e ci --ignore-scripts

      - name: Install Playwright browsers
        run: npm --prefix web/e2e exec -- playwright install --with-deps chromium firefox

      # typecheck, lint, unit tests, static export, CSP/privacy audits and the
      # edge asset gate for web/; the Worker's own checks; then the browser
      # suite against a real daemon on Chromium and Firefox, desktop and narrow.
      - name: Web gates
        run: make test-web

  build-macos:
    name: Build smoke (macOS)
    runs-on: macos-latest
    needs: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mac-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mac-v2-

      # Same lint and scanner fixtures as the Linux `fast` job, but with the
      # BSD grep/sed/find the hosted macOS image ships, so a scanner that
      # only works with GNU tools fails here instead of passing silently.
      - name: Architecture lint (BSD tools)
        run: make architecture-lint

      - name: Release runner script (macOS)
        run: |
          bash -n scripts/release.sh tools/release-runner.sh tools/test-release-runner.sh tools/apple-silicon-prerelease.sh tools/prerelease-ci-gate.sh tools/test-prerelease-ci-gate.sh
          bash tools/test-release-runner.sh
          bash tools/test-prerelease-ci-gate.sh

      - name: Build release
        run: cargo build --workspace --release

      - name: Hermetic tests
        run: make test-fast

  static-workspace-build:
    name: Static workspace build (${{ matrix.features || 'default' }})
    runs-on: ubuntu-24.04
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        features: ["", "builtin-runtime"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"
          targets: x86_64-unknown-linux-musl
      - name: Install static C toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the one distribution executable
        env:
          BUILD_FEATURES: ${{ matrix.features }}
        run: |
          args=()
          if [ -n "$BUILD_FEATURES" ]; then args=(--features "$BUILD_FEATURES"); fi
          cargo build --workspace --locked --release --target x86_64-unknown-linux-musl --bins "${args[@]}"
      - name: Smoke-test static executable
        run: |
          artifact=target/x86_64-unknown-linux-musl/release/awman
          "$artifact" --version
          if readelf -l "$artifact" | grep -q INTERP; then
            echo 'Expected a static executable without a dynamic loader'
            exit 1
          fi

  builtin-build:
    name: Builtin build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only targets whose payload manifest status is `verified`; build.rs
          # refuses the others. Add x86_64 Linux and Apple Silicon once verified.
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
            third_party/msb-payloads/${{ matrix.target }}
          key: ${{ runner.os }}-builtin-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'third_party/msb-payloads/manifest.toml') }}
      - name: Prepare checked inputs
        run: |
          bash tools/msb-payloads/fetch.sh ${{ matrix.target }}
      - name: "Build builtin runtime (2 jobs: each test binary links the whole VM stack)"
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo build --workspace --locked --features builtin-runtime --target ${{ matrix.target }}
      - name: Inspect dynamic dependencies
        run: |
          if [ "${{ runner.os }}" = macOS ]; then otool -L target/${{ matrix.target }}/debug/awman; else ldd target/${{ matrix.target }}/debug/awman; fi
      - name: Builtin non-hardware tests (hosted runners have no KVM; builtin_hw tests SKIP)
        env:
          CARGO_BUILD_JOBS: "2"
        run: make test-builtin

  # Real guests on real hardware. Hosted runners have no KVM, so these run on
  # self-hosted machines, on demand or nightly - never on push/PR. A missing
  # prerequisite FAILS the job (AWMAN_TEST_BUILTIN_REQUIRE_HW): it is BLOCKED,
  # never a pass and never a silent skip. The x86_64 Linux and Apple Silicon
  # entries fail at the payload step until their kernel records in
  # third_party/msb-payloads/manifest.toml are verified on native hardware.
  builtin-hardware:
    name: Builtin hardware (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The builtin runtime is released for macOS on Apple Silicon only;
          # WI 0124 re-adds the Linux KVM runners.
          - { name: macos-arm64, target: aarch64-apple-darwin, runs-on: [self-hosted, macOS, ARM64, hypervisor] }
    env:
      AWMAN_TEST_BUILTIN: "1"
      AWMAN_TEST_BUILTIN_REQUIRE_HW: "1"
      AWMAN_TEST_BUILTIN_NETWORK: "1"
      AWMAN_TEST_BUILTIN_PRESSURE: "1"
      AWMAN_TEST_BUILTIN_REPORT: ${{ github.workspace }}/builtin-hw-report.tsv
    steps:
      # tools/release-runner.sh registers a Mac as `awman-release-<tag>-<host>`
      # for one release. A Tests job that lands on it (the nightly cron during a
      # release, say) fails here at once, so the Release job gets the runner.
      - name: Not on a temporary release runner
        shell: bash
        run: |
          case "$RUNNER_NAME" in awman-release-*) echo "BLOCKED: $RUNNER_NAME is a temporary release runner; re-run once a CI hypervisor runner is online"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The builtin upgrade test builds the previous awman from git history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"
      - name: Check hardware prerequisites (fails, never skips)
        shell: bash
        run: |
          case "$(uname -s)" in
            Linux)
              if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
                echo "BLOCKED: /dev/kvm is not read/write accessible for $(id -un)"; ls -l /dev/kvm || true; exit 1
              fi
              ;;
            Darwin)
              [ "$(uname -m)" = arm64 ] || { echo "BLOCKED: Apple Silicon is required"; exit 1; }
              [ "$(sysctl -n kern.hv_support)" = 1 ] || { echo "BLOCKED: Hypervisor.framework unsupported (kern.hv_support != 1)"; exit 1; }
              ;;
          esac
      - name: Prepare checked inputs
        shell: bash
        run: |
          bash tools/msb-payloads/fetch.sh "${{ matrix.target }}"
          bash tools/msb-payloads/verify.sh "${{ matrix.target }}"
      - name: Produce the fixture base image (docker-save layout, uncompressed layers)
        shell: bash
        run: |
          command -v skopeo >/dev/null || { echo "BLOCKED: skopeo is required to fetch the fixture base image"; exit 1; }
          skopeo copy --override-os linux --format v2s2 docker://docker.io/library/alpine:3.22 "docker-archive:$RUNNER_TEMP/base.tar"
          echo "AWMAN_TEST_BUILTIN_BASE_TAR=$RUNNER_TEMP/base.tar" >> "$GITHUB_ENV"
      - name: Build tests, awman and the guest driver
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo test --workspace --locked --features builtin-runtime --lib --bins --examples --test builtin_runtime --test oci_import --test data_layer --no-run
      - name: Builtin tests including real guests
        run: make test-builtin
      - name: Report (SKIP/BLOCKED/RUN per hardware test)
        if: always()
        run: cat "$AWMAN_TEST_BUILTIN_REPORT" || true

  native-typed-provider:
    name: Clean native build and typed-provider gate (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64-hvf, target: aarch64-apple-darwin, runs-on: [self-hosted, macOS, ARM64, hypervisor] }
    steps:
      # See builtin-hardware: never hold a temporary release runner.
      - name: Not on a temporary release runner
        shell: bash
        run: |
          case "$RUNNER_NAME" in awman-release-*) echo "BLOCKED: $RUNNER_NAME is a temporary release runner; re-run once a CI hypervisor runner is online"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The builtin upgrade test builds the previous awman from git history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}
      - name: Provision disposable OCI guest fixture
        shell: bash
        run: |
          command -v skopeo >/dev/null || { echo "BLOCKED: skopeo is required for the guest fixture"; exit 1; }
          # The tests boot the promoted fixture built from this base, not plain alpine.
          skopeo copy --override-os linux --format v2s2 docker://docker.io/library/alpine:3.22 "docker-archive:$RUNNER_TEMP/base.tar"
          cargo run --locked --quiet --manifest-path tools/oci-runtime-spike/fixture/Cargo.toml -- "$RUNNER_TEMP/base.tar" "$RUNNER_TEMP"
          echo "AWMAN_TEST_BUILTIN_FIXTURE_ARCHIVE=$RUNNER_TEMP/fixture-oci.tar" >> "$GITHUB_ENV"
      - name: Build and boot the current provider from this clean checkout
        env:
          CARGO_BUILD_JOBS: "2"
          AWMAN_TEST_BUILTIN: "1"
          AWMAN_TEST_BUILTIN_REQUIRE_HW: "1"
          AWMAN_TEST_BUILTIN_NETWORK: "1"
          AWMAN_TEST_BUILTIN_PRESSURE: "1"
        run: bash tools/native-builtin-ci.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-payload-evidence-${{ matrix.name }}
          path: |
            third_party/msb-payloads/${{ matrix.target }}/kernel.meta
            third_party/msb-payloads/${{ matrix.target }}/provenance.txt
          if-no-files-found: ignore

  existing-backend-unsupported-targets:
    name: Existing backends with builtin disabled (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, target: x86_64-pc-windows-msvc, runs-on: windows-2025 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}
      - name: Build default existing backends (builtin feature disabled)
        run: cargo build --workspace --locked --target "${{ matrix.target }}" --bin awman
      - name: Assert unsupported builtin selection reports a precise target error
        run: cargo test --workspace --locked --target "${{ matrix.target }}" --lib unavailable_build_or_test_isolation_reports_a_precise_reason -- --nocapture
