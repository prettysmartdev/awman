name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

jobs:
  fast:
    name: Fast checks (lint, fmt, clippy, hermetic tests)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fast-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fast-v2-

      - name: Architecture lint
        run: make architecture-lint

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Hermetic tests
        run: make test-fast

  full-linux-docker:
    name: Full tests with Docker (Linux)
    runs-on: ubuntu-26.04
    needs: fast
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-full-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-full-v2-

      - name: Verify Docker is available
        run: docker info

      - name: Full test suite (real Docker, real git)
        run: make test-full

  build-macos:
    name: Build smoke (macOS)
    runs-on: macos-latest
    needs: fast
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mac-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mac-v2-

      - name: Build release
        run: cargo build --release

      - name: Hermetic tests
        run: make test-fast

  builtin-build:
    name: Builtin build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only targets whose payload manifest status is `verified`; build.rs
          # refuses the others. Add x86_64 Linux and Apple Silicon once verified.
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
            third_party/msb-payloads/${{ matrix.target }}
          key: ${{ runner.os }}-builtin-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'third_party/msb-payloads/manifest.toml') }}
      - name: Prepare checked inputs
        run: |
          bash tools/msb-payloads/fetch.sh ${{ matrix.target }}
          if [ "${{ runner.os }}" = Linux ]; then bash third_party/native/libcap-ng/build.sh ${{ matrix.target }}; fi
      - name: "Build builtin runtime (2 jobs: each test binary links the whole VM stack)"
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo build --locked --features builtin-runtime --target ${{ matrix.target }}
      - name: Inspect dynamic dependencies
        run: |
          if [ "${{ runner.os }}" = macOS ]; then otool -L target/${{ matrix.target }}/debug/awman; else ldd target/${{ matrix.target }}/debug/awman; fi
      - name: Builtin non-hardware tests (hosted runners have no KVM; builtin_hw tests SKIP)
        env:
          CARGO_BUILD_JOBS: "2"
        run: make test-builtin

  # Real guests on real hardware. Hosted runners have no KVM, so these run on
  # self-hosted machines, on demand or nightly - never on push/PR. A missing
  # prerequisite FAILS the job (AWMAN_TEST_BUILTIN_REQUIRE_HW): it is BLOCKED,
  # never a pass and never a silent skip. The x86_64 Linux and Apple Silicon
  # entries fail at the payload step until their kernel records in
  # third_party/msb-payloads/manifest.toml are verified on native hardware.
  builtin-hardware:
    name: Builtin hardware (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-arm64, target: aarch64-unknown-linux-gnu, runs-on: [self-hosted, linux, arm64, kvm] }
          - { name: linux-x86_64, target: x86_64-unknown-linux-gnu, runs-on: [self-hosted, linux, x64, kvm] }
          - { name: macos-arm64, target: aarch64-apple-darwin, runs-on: [self-hosted, macOS, ARM64, hypervisor] }
    env:
      AWMAN_TEST_BUILTIN: "1"
      AWMAN_TEST_BUILTIN_REQUIRE_HW: "1"
      AWMAN_TEST_BUILTIN_NETWORK: "1"
      AWMAN_TEST_BUILTIN_PRESSURE: "1"
      AWMAN_TEST_BUILTIN_REPORT: ${{ github.workspace }}/builtin-hw-report.tsv
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
      - name: Check hardware prerequisites (fails, never skips)
        shell: bash
        run: |
          case "$(uname -s)" in
            Linux)
              if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
                echo "BLOCKED: /dev/kvm is not read/write accessible for $(id -un)"; ls -l /dev/kvm || true; exit 1
              fi
              ;;
            Darwin)
              [ "$(uname -m)" = arm64 ] || { echo "BLOCKED: Apple Silicon is required"; exit 1; }
              [ "$(sysctl -n kern.hv_support)" = 1 ] || { echo "BLOCKED: Hypervisor.framework unsupported (kern.hv_support != 1)"; exit 1; }
              ;;
          esac
      - name: Prepare checked inputs
        shell: bash
        run: |
          bash tools/msb-payloads/fetch.sh "${{ matrix.target }}"
          bash tools/msb-payloads/verify.sh "${{ matrix.target }}"
          if [ "$(uname -s)" = Linux ]; then bash third_party/native/libcap-ng/build.sh "${{ matrix.target }}"; fi
      - name: Produce the fixture base image (docker-save layout, uncompressed layers)
        shell: bash
        run: |
          command -v skopeo >/dev/null || { echo "BLOCKED: skopeo is required to fetch the fixture base image"; exit 1; }
          skopeo copy --override-os linux --format docker docker://docker.io/library/alpine:3.22 "docker-archive:$RUNNER_TEMP/base.tar"
          echo "AWMAN_TEST_BUILTIN_BASE_TAR=$RUNNER_TEMP/base.tar" >> "$GITHUB_ENV"
      - name: Build tests, awman and the guest driver
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo test --locked --features builtin-runtime --lib --bins --examples --test builtin_runtime --test oci_import --test data_layer --no-run
      - name: Builtin tests including real guests
        run: make test-builtin
      - name: Report (SKIP/BLOCKED/RUN per hardware test)
        if: always()
        run: cat "$AWMAN_TEST_BUILTIN_REPORT" || true

  native-typed-provider:
    name: Clean native build and typed-provider gate (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-arm64-kvm, target: aarch64-unknown-linux-gnu, runs-on: [self-hosted, linux, arm64, kvm] }
          - { name: linux-x86_64-kvm, target: x86_64-unknown-linux-gnu, runs-on: [self-hosted, linux, x64, kvm] }
          - { name: macos-arm64-hvf, target: aarch64-apple-darwin, runs-on: [self-hosted, macOS, ARM64, hypervisor] }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}
      - name: Provision disposable OCI guest fixture
        shell: bash
        run: |
          command -v skopeo >/dev/null || { echo "BLOCKED: skopeo is required for the guest fixture"; exit 1; }
          skopeo copy --override-os linux --format oci docker://docker.io/library/alpine:3.22 "oci-archive:$RUNNER_TEMP/awman-fixture.tar"
          echo "AWMAN_TEST_BUILTIN_FIXTURE_ARCHIVE=$RUNNER_TEMP/awman-fixture.tar" >> "$GITHUB_ENV"
      - name: Build and boot the current provider from this clean checkout
        env:
          CARGO_BUILD_JOBS: "2"
          AWMAN_TEST_BUILTIN: "1"
          AWMAN_TEST_BUILTIN_REQUIRE_HW: "1"
          AWMAN_TEST_BUILTIN_NETWORK: "1"
          AWMAN_TEST_BUILTIN_PRESSURE: "1"
        run: bash tools/native-builtin-ci.sh "${{ matrix.target }}"
      - name: SQLite exact dependency, cross-driver and catalog round trips
        env:
          SQLITE_SPIKE_OUTPUT_DIR: ${{ runner.temp }}/sqlite-results
        run: bash tools/oci-runtime-spike/sqlite-resolution/checks.sh auto
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sqlite-resolution-${{ matrix.name }}
          path: ${{ runner.temp }}/sqlite-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-payload-evidence-${{ matrix.name }}
          path: |
            third_party/msb-payloads/${{ matrix.target }}/kernel.meta
            third_party/msb-payloads/${{ matrix.target }}/provenance.txt
            third_party/native/libcap-ng/${{ matrix.target }}/libcap-ng.a
          if-no-files-found: ignore

  existing-backend-unsupported-targets:
    name: Existing backends with builtin disabled (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, target: x86_64-pc-windows-msvc, runs-on: windows-2025 }
          - { name: macos-intel, target: x86_64-apple-darwin, runs-on: [self-hosted, macOS, Intel] }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}
      - name: Build default existing backends (builtin feature disabled)
        run: cargo build --locked --target "${{ matrix.target }}" --bin awman
      - name: Assert unsupported builtin selection reports a precise target error
        run: cargo test --locked --target "${{ matrix.target }}" --lib unavailable_build_or_test_isolation_reports_a_precise_reason -- --nocapture
