name: Tests

# Status shim (WI 0144 design 13.1): branch protection may still require these
# legacy check names. Every job calls the same manifest-backed Make targets as
# ci.yml; the full job graph, caches and hardware cells live in ci.yml and
# nightly.yml. Delete this file (and its [[legacy_fallback]] row in
# ci/gates.toml) when cutover row P2 switches the required check to `gate`.
# The job ids and names below are kept because the exact required contexts
# have not been API-verified.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: Fast checks (lint, fmt, clippy, hermetic tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - name: Install the pinned test runner
        run: cargo xtask test install-runner

      - name: Release runner contract (kept until P5)
        run: |
          bash -n scripts/release.sh tools/release-runner.sh tools/test-release-runner.sh
          bash tools/test-release-runner.sh

      - name: Lints and unit tier
        run: make check

      - name: Unit and component tiers, both backends
        run: make test

      - name: Retained legacy targets
        run: make legacy-test

  full-linux-docker:
    name: Full tests with Docker (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"

      - name: Install the pinned test runner
        run: cargo xtask test install-runner

      - name: Verify Docker is available
        run: docker info

      - name: Boundary tier against the runner's Docker engine
        run: make test-boundary AWMAN_TEST_HOST_RESOURCES="docker=unix:///var/run/docker.sock"

      - name: Retained legacy targets with real Docker
        run: make legacy-test LEGACY_DOCKER=1

  web:
    name: Web app, edge Worker and browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"

      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"

      - name: Install npm 11
        run: npm install --global npm@11.17.0

      - name: Install pinned web dependencies
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web/edge ci --ignore-scripts
          npm --prefix web/e2e ci --ignore-scripts

      - name: Install Playwright browsers
        run: npm --prefix web/e2e exec -- playwright install --with-deps chromium firefox

      - name: Web gates
        run: make test-web

  build-macos:
    name: Build smoke (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (toolchain pinned below)
        with:
          toolchain: "1.94.0"

      - name: Install the pinned test runner
        run: cargo xtask test install-runner

      - name: Architecture lint (BSD tools)
        run: make architecture-lint

      - name: Build release
        run: cargo build -p awman-cli --bin awman --release

      - name: Unit and component tiers, both backends
        run: make test
