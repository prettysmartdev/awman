name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Least privilege by default; only the `release` job gets contents: write.
permissions:
  contents: read

jobs:
  # Cheap checks that would otherwise only fail after the (long, self-hosted)
  # builds: the tag must match the Cargo.toml version (aspec/devops/cicd.md,
  # Versioning) and the release notes the release body is built from must exist.
  preflight:
    name: Tag, version and release notes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml version and release notes exist
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)
          [ "$tag" = "v$cargo_version" ] || { echo "::error::tag $tag does not match Cargo.toml version $cargo_version (expected v$cargo_version)"; exit 1; }
          [ -f "docs/releases/$tag.md" ] || { echo "::error::docs/releases/$tag.md is missing; it is the GitHub Release body"; exit 1; }
          echo "OK: $tag, docs/releases/$tag.md"

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: awman-linux-amd64
            # Payload manifest status is `unverified` (build.rs refuses it); enable
            # once tools/msb-payloads/fetch.sh has run natively and recorded hashes.
            builtin: false
          # The builtin runtime is released for macOS on Apple Silicon only
          # (release-macos-builtin below); Linux arm64 ships without it until
          # WI 0124's native gates pass.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: awman-linux-arm64
            builtin: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: awman-windows-amd64.exe
            builtin: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}

      - name: Prepare builtin payloads and native archive
        if: matrix.builtin
        run: |
          bash tools/msb-payloads/fetch.sh ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.builtin }}" = true ]; then
            cargo build --workspace --locked --release --features builtin-runtime --target ${{ matrix.target }}
          else
            cargo build --workspace --locked --release --target ${{ matrix.target }}
          fi

      - name: Record release size and startup measurements
        if: runner.os != 'Windows'
        run: bash tools/measure-release-artifact.sh "target/${{ matrix.target }}/release/awman" "${{ matrix.target }}" "release-measurements/${{ matrix.target }}" --host-only

      - name: Inspect release dependencies and extracted helpers
        if: runner.os != 'Windows'
        run: |
          mkdir -p dependency-listing state-smoke
          if [ "${{ runner.os }}" = macOS ]; then
            otool -L target/${{ matrix.target }}/release/awman > dependency-listing/${{ matrix.target }}.txt
          else
            ldd target/${{ matrix.target }}/release/awman > dependency-listing/${{ matrix.target }}.txt
          fi
          HOME="$PWD/state-smoke" target/${{ matrix.target }}/release/awman --version
          find state-smoke -type f \( -name 'msb' -o -name 'agentd' -o -name 'libkrunfw*' \) > dependency-listing/${{ matrix.target }}-helpers.txt
          test ! -s dependency-listing/${{ matrix.target }}-helpers.txt

      - name: Scan the optimized artifact (dependencies, .msbver section, helper extraction, worker refusals)
        if: matrix.builtin
        env:
          AWMAN_TEST_BUILTIN_ARTIFACT: ${{ github.workspace }}/target/${{ matrix.target }}/release/awman
        run: >-
          bash tools/isolated-test.sh --locked --release --features builtin-runtime
          --target ${{ matrix.target }} --test builtin_runtime --
          builtin_dependency builtin_binary_carries builtin_no_helper builtin_info
          builtin_ambient builtin_worker builtin_version builtin_trace

      - name: Upload dependency listing
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: dependency-listing-${{ matrix.target }}
          path: |
            dependency-listing/
            release-measurements/

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/awman ${{ matrix.artifact }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/awman.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release-macos-builtin:
    name: Apple Silicon builtin artifact and boot gate
    needs: preflight
    runs-on: [self-hosted, macOS, ARM64, hypervisor]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          # The builtin state upgrade policy compares against the previous
          # release tag, so it needs the full history and tags.
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: aarch64-apple-darwin
      - name: Isolate cargo source and target caches
        shell: bash
        run: |
          echo "CARGO_HOME=$(mktemp -d "$RUNNER_TEMP/awman-cargo-home.XXXXXX")" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$(mktemp -d "$RUNNER_TEMP/awman-target.XXXXXX")" >> "$GITHUB_ENV"
      - name: Prepare native verified payload
        run: |
          test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64 && test "$(sysctl -n kern.hv_support)" = 1 || { echo "BLOCKED: Apple Silicon Hypervisor.framework runner is required"; exit 1; }
          bash tools/msb-payloads/fetch.sh aarch64-apple-darwin
          bash tools/msb-payloads/verify.sh aarch64-apple-darwin
      - name: Build final optimized awman executable
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo build --workspace --locked --release --features builtin-runtime --target aarch64-apple-darwin --bin awman
      - name: Ad-hoc sign the distribution binary (hypervisor entitlement; no notarization)
        run: |
          artifact="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/awman"
          cp "$artifact" awman-macos-arm64
          # Reproducibility compares the unsigned build; signing changes the bytes.
          shasum -a 256 awman-macos-arm64 > release-macos-awman.unsigned.sha256
          bash tools/macos-sign.sh awman-macos-arm64
          shasum -a 256 awman-macos-arm64 > release-macos-awman.sha256
          codesign -d --entitlements - --xml awman-macos-arm64 > release-macos-awman.entitlements.plist
      - name: Trace and boot the exact signed, distributed artifact
        run: |
          test -x /opt/awman/release-offline-session.sh || { echo "BLOCKED: native release runner must provision /opt/awman/release-offline-session.sh with cached fixture and enforced network denial"; exit 1; }
          test -x /opt/awman/release-workload.sh || { echo "BLOCKED: native release runner must provision /opt/awman/release-workload.sh (realistic cached guest workload that writes guest RSS to AWMAN_GUEST_RSS_OUTPUT)"; exit 1; }
          bash tools/release-artifact-check.sh "$PWD/awman-macos-arm64" aarch64-apple-darwin release-evidence/macos /opt/awman/release-offline-session.sh
          bash tools/measure-release-artifact.sh "$PWD/awman-macos-arm64" aarch64-apple-darwin release-evidence/macos-measurements /opt/awman/release-workload.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: awman-macos-arm64-builtin
          path: |
            awman-macos-arm64
            release-macos-awman.*
            release-evidence/
            third_party/msb-payloads/aarch64-apple-darwin/kernel.meta
            third_party/msb-payloads/aarch64-apple-darwin/provenance.txt
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: [build, release-macos-builtin]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          for name in awman-linux-amd64 awman-linux-arm64 awman-macos-arm64 awman-windows-amd64.exe; do
            matches=$(find artifacts -type f -name "$name")
            [ "$(printf '%s\n' "$matches" | grep -c .)" = 1 ] || { echo "::error::expected exactly one $name in the downloaded artifacts, found: ${matches:-none}"; exit 1; }
            cp "$matches" release/
          done
          # Published checksums (docs/11-runtimes.md tells macOS users to verify
          # the ad-hoc signed binary against them).
          (cd release && sha256sum awman-* > SHA256SUMS)
          ls -la release/
          cat release/SHA256SUMS

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # The preflight job already required docs/releases/<tag>.md.
      - name: Create release with notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          body_path: docs/releases/${{ steps.tag.outputs.version }}.md
          files: release/*
