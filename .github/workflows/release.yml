name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: awman-linux-amd64
            # Payload manifest status is `unverified` (build.rs refuses it); enable
            # once tools/msb-payloads/fetch.sh has run natively and recorded hashes.
            builtin: false
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: awman-macos-amd64
            builtin: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: awman-windows-amd64.exe
            builtin: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}

      - name: Prepare builtin payloads and native archive
        if: matrix.builtin
        run: |
          bash tools/msb-payloads/fetch.sh ${{ matrix.target }}
          if [ "${{ runner.os }}" = Linux ]; then bash third_party/native/libcap-ng/build.sh ${{ matrix.target }}; fi

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.builtin }}" = true ]; then
            cargo build --locked --release --features builtin-runtime --target ${{ matrix.target }}
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi

      - name: Record release size and startup measurements
        if: runner.os != 'Windows' && matrix.target != 'x86_64-apple-darwin'
        run: bash tools/measure-release-artifact.sh "target/${{ matrix.target }}/release/awman" "${{ matrix.target }}" "release-measurements/${{ matrix.target }}" --host-only

      - name: Inspect release dependencies and extracted helpers
        if: runner.os != 'Windows'
        run: |
          mkdir -p dependency-listing state-smoke
          if [ "${{ runner.os }}" = macOS ]; then
            otool -L target/${{ matrix.target }}/release/awman > dependency-listing/${{ matrix.target }}.txt
          else
            ldd target/${{ matrix.target }}/release/awman > dependency-listing/${{ matrix.target }}.txt
          fi
          HOME="$PWD/state-smoke" target/${{ matrix.target }}/release/awman --version
          find state-smoke -type f \( -name 'msb' -o -name 'agentd' -o -name 'libkrunfw*' \) > dependency-listing/${{ matrix.target }}-helpers.txt
          test ! -s dependency-listing/${{ matrix.target }}-helpers.txt

      - name: Scan the optimized artifact (dependencies, .msbver section, helper extraction, worker refusals)
        if: matrix.builtin
        env:
          AWMAN_TEST_BUILTIN_ARTIFACT: ${{ github.workspace }}/target/${{ matrix.target }}/release/awman
        run: >-
          bash tools/isolated-test.sh --locked --release --features builtin-runtime
          --target ${{ matrix.target }} --test builtin_runtime --
          builtin_dependency builtin_binary_carries builtin_no_helper builtin_info
          builtin_ambient builtin_worker builtin_version builtin_trace

      - name: Upload dependency listing
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: dependency-listing-${{ matrix.target }}
          path: |
            dependency-listing/
            release-measurements/

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/awman ${{ matrix.artifact }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/awman.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release-macos-builtin:
    name: Apple Silicon builtin artifact and boot gate
    runs-on: [self-hosted, macOS, ARM64, hypervisor]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: aarch64-apple-darwin
      - name: Isolate cargo source and target caches
        shell: bash
        run: |
          echo "CARGO_HOME=$(mktemp -d "$RUNNER_TEMP/awman-cargo-home.XXXXXX")" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$(mktemp -d "$RUNNER_TEMP/awman-target.XXXXXX")" >> "$GITHUB_ENV"
      - name: Prepare native verified payload
        run: |
          test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64 && test "$(sysctl -n kern.hv_support)" = 1 || { echo "BLOCKED: Apple Silicon Hypervisor.framework runner is required"; exit 1; }
          bash tools/msb-payloads/fetch.sh aarch64-apple-darwin
          bash tools/msb-payloads/verify.sh aarch64-apple-darwin
      - name: Build final optimized awman executable
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo build --locked --release --features builtin-runtime --target aarch64-apple-darwin --bin awman
      - name: Prepare the distribution binary (no signing or notarization)
        run: |
          artifact="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/awman"
          cp "$artifact" awman-macos-arm64
          shasum -a 256 awman-macos-arm64 > release-macos-awman.sha256
      - name: Trace and boot the exact distributed artifact
        run: |
          test -x /opt/awman/release-offline-session.sh || { echo "BLOCKED: native release runner must provision /opt/awman/release-offline-session.sh with cached fixture and enforced network denial"; exit 1; }
          bash tools/release-artifact-check.sh "$PWD/awman-macos-arm64" aarch64-apple-darwin release-evidence/macos /opt/awman/release-offline-session.sh
          bash tools/measure-release-artifact.sh "$PWD/awman-macos-arm64" aarch64-apple-darwin release-evidence/macos-measurements /opt/awman/release-workload.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: awman-macos-arm64-builtin
          path: |
            awman-macos-arm64
            release-macos-awman.*
            release-evidence/
            third_party/msb-payloads/aarch64-apple-darwin/kernel.meta
            third_party/msb-payloads/aarch64-apple-darwin/provenance.txt
          if-no-files-found: ignore

  release-linux-arm64-builtin:
    name: Linux ARM64 optimized builtin artifact and boot gate
    runs-on: [self-hosted, linux, arm64, kvm, trace]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: aarch64-unknown-linux-gnu
      - name: Isolate cargo source and target caches
        shell: bash
        run: |
          echo "CARGO_HOME=$(mktemp -d "$RUNNER_TEMP/awman-cargo-home.XXXXXX")" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$(mktemp -d "$RUNNER_TEMP/awman-target.XXXXXX")" >> "$GITHUB_ENV"
      - name: Prepare verified payload and static native library
        run: |
          test -r /dev/kvm && test -w /dev/kvm || { echo "BLOCKED: writable KVM is required"; exit 1; }
          command -v strace >/dev/null || { echo "BLOCKED: strace is required for the release trace"; exit 1; }
          bash tools/msb-payloads/fetch.sh aarch64-unknown-linux-gnu
          bash tools/msb-payloads/verify.sh aarch64-unknown-linux-gnu
          bash third_party/native/libcap-ng/build.sh aarch64-unknown-linux-gnu
      - name: Build final optimized awman executable
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo build --locked --release --features builtin-runtime --target aarch64-unknown-linux-gnu --bin awman
      - name: Trace and boot the exact distributed artifact
        run: |
          test -x /opt/awman/release-offline-session.sh || { echo "BLOCKED: native release runner must provision /opt/awman/release-offline-session.sh with cached fixture and network namespace isolation"; exit 1; }
          bash tools/release-artifact-check.sh "$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/release/awman" aarch64-unknown-linux-gnu release-evidence/linux-arm64 /opt/awman/release-offline-session.sh
          bash tools/measure-release-artifact.sh "$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/release/awman" aarch64-unknown-linux-gnu release-evidence/linux-arm64-measurements /opt/awman/release-workload.sh
          cp "$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/release/awman" awman-linux-arm64
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: awman-linux-arm64-builtin
          path: |
            awman-linux-arm64
            release-evidence/
            third_party/msb-payloads/aarch64-unknown-linux-gnu/kernel.meta
            third_party/msb-payloads/aarch64-unknown-linux-gnu/provenance.txt
            third_party/native/libcap-ng/aarch64-unknown-linux-gnu/libcap-ng.a
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: [build, release-linux-arm64-builtin, release-macos-builtin]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'awman-linux-amd64' -o -name 'awman-linux-arm64' -o -name 'awman-macos-amd64' -o -name 'awman-macos-arm64' -o -name 'awman-windows-amd64.exe' \) -exec cp {} release/ \;
          ls -la release/

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Check for release notes
        id: notes
        run: |
          NOTES_FILE="docs/releases/${{ steps.tag.outputs.version }}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release with notes
        if: steps.notes.outputs.exists == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          body_path: ${{ steps.notes.outputs.file }}
          files: release/*

      - name: Create release without notes
        if: steps.notes.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          files: release/*
