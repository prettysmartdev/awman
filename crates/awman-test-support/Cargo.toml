[package]
name = "awman-test-support"
# Fixed, not the workspace version: a release version bump must change only
# awman's own Cargo.lock entries.
version = "0.0.0"
edition = "2021"
rust-version = "1.94.0"
publish = false
description = "Test infrastructure for awman: sandbox, process supervisor, capabilities, fixtures, fakes and failure evidence. Dev-only; never shipped."
# Targets are registered explicitly (WI 0144 design 5.3: discovery is verified).
autotests = false
autobins = false
autoexamples = false
build = "build.rs"

[lib]
path = "src/lib.rs"

# The std-only fake command-line tool (FakeCli protocol), registered here so
# this crate's own tests can install it (`CARGO_BIN_EXE_awman-test-support-fake-cli`).
[[bin]]
name = "awman-test-support-fake-cli"
path = "fake-cli/main.rs"
test = false
doc = false

# Process, network and fixture tests of this crate: tier `component`
# (suite `component-test-support`). Inline unit tests are tier `unit`
# (suite `unit-test-support`).
[[test]]
name = "component"
path = "tests/component/main.rs"

# This crate must never depend on `awman`, `awman-cli` or `awman-host-shims`.
# The library's own unit tests use it as a dev-dependency, and a dependency
# back on the library would give them a second, incompatible copy of its types.
[dependencies]
awman-wsp = { workspace = true, features = ["mock"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
portable-pty = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process", "fs", "user"] }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console"] }
