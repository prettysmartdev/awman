[package]
name = "awman-host-shims"
version.workspace = true
edition = "2021"
rust-version = "1.94.0"
publish = false

[features]
default = []
builtin-runtime = ["dep:clap", "dep:microsandbox-cli", "dep:msb_krun"]

[dependencies]
# Only Layer 0 runtime constants are imported from this library.
awman = { path = "../.." }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }

[target.'cfg(any(all(target_os = "macos", target_arch = "aarch64"), all(target_os = "linux", target_env = "gnu", any(target_arch = "aarch64", target_arch = "x86_64"))))'.dependencies]
microsandbox-cli = { version = "=0.7.2", default-features = false, features = ["net", "embed-binaries"], optional = true }
msb_krun = { version = "=0.1.39", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["user", "fs"] }

[build-dependencies]
sha2 = "0.11"
toml = "1"

[dev-dependencies]
tempfile = "3"
