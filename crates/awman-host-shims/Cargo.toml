[package]
name = "awman-host-shims"
version.workspace = true
edition = "2021"
rust-version = "1.94.0"
publish = false

[features]
default = []
# `static-krunfw` makes msb_krun call `kernel::krunfw_get_kernel` instead of
# loading a firmware library. The feature unifies onto every msb_krun consumer.
builtin-runtime = ["dep:clap", "dep:microsandbox-cli", "dep:msb_krun", "msb_krun/static-krunfw"]

[dependencies]
# Only Layer 0 runtime constants are imported from this library.
awman = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true, optional = true }

[target.'cfg(any(all(target_os = "macos", target_arch = "aarch64"), all(target_os = "linux", target_env = "gnu", any(target_arch = "aarch64", target_arch = "x86_64"))))'.dependencies]
microsandbox-cli = { workspace = true, optional = true }
msb_krun = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true, features = ["user", "fs"] }

[build-dependencies]
sha2 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
