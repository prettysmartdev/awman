[package]
name = "awman-cli"
version.workspace = true
edition = "2021"
rust-version = "1.94.0"
publish = false
autobins = false
autoexamples = false
description = "A containerized code agent manager"
# Integration tests are registered explicitly below so Cargo only builds the
# maintained suites for this package.
autotests = false
build = "build.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(awman_builtin)'] }

[[bin]]
name = "awman"
path = "../../src/main.rs"

# WI 0144 test helpers. Release and install builds select `--bin awman`
# explicitly; these are never packaged.
[[bin]]
name = "awman-fake-cli"
path = "../awman-test-support/fake-cli/main.rs"
test = false
doc = false

[[bin]]
name = "awman-guest-driver"
path = "../../tests/drivers/guest_driver.rs"
required-features = ["guest-drivers"]
test = false
doc = false

[[bin]]
name = "awman-guest-net-driver"
path = "../../tests/drivers/guest_net_driver.rs"
required-features = ["guest-drivers"]
test = false
doc = false

# `make docs-reference`: regenerates docs/14-command-reference.md from the
# command catalogue. A developer tool, never packaged.
[[bin]]
name = "awman-command-reference"
path = "../../src/command/dispatch/projections/render_reference.rs"
test = false
doc = false

[features]
default = []
builtin-runtime = ["awman/builtin-runtime", "awman-host-shims/builtin-runtime", "dep:microsandbox", "dep:sqlx"]
# Builds the guest tier and its driver executables (WI 0144 design 8.1).
# Never enabled by a release build.
guest-drivers = ["builtin-runtime"]

[dependencies]
awman = { workspace = true }
awman-host-shims = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }

# Used only by the builtin_runtime integration tests. These are regular
# dependencies because Cargo does not allow optional dev-dependencies.
[target.'cfg(any(all(target_os = "macos", target_arch = "aarch64"), all(target_os = "linux", target_env = "gnu", any(target_arch = "aarch64", target_arch = "x86_64"))))'.dependencies]
microsandbox = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
awman-wsp = { workspace = true, features = ["mock"] }
awman = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }
wiremock = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
portable-pty = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
tokio-util = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
sha2 = { workspace = true }
shell-words = { workspace = true }
toml = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
rcgen = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
nix = { workspace = true, features = ["signal", "process", "fs", "poll", "user"] }
libc = { workspace = true }
# WI 0144 test infrastructure (the support crate never depends on awman).
awman-test-support = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }

# Tier binaries, explicitly registered and selected by ci/gates.toml.
[[test]]
name = "component"
path = "../../tests/component/main.rs"

[[test]]
name = "boundary"
path = "../../tests/boundary/main.rs"

[[test]]
name = "guest"
path = "../../tests/guest/main.rs"
required-features = ["guest-drivers"]

[[test]]
name = "artifact"
path = "../../tests/artifact/main.rs"
