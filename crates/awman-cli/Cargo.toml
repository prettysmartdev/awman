[package]
name = "awman-cli"
version.workspace = true
edition = "2021"
rust-version = "1.94.0"
publish = false
autobins = false
autoexamples = false
description = "A containerized code agent manager"
# Top-level tests/ targets reference the old (oldsrc) library API; they are
# rebuilt from scratch in work item 0072 alongside the deletion of oldsrc/.
# Suppress auto-discovery so `cargo test` only runs Layer 0–3 unit tests
# until then.
autotests = false

[[bin]]
name = "awman"
path = "../../src/main.rs"

[features]
default = []
builtin-runtime = ["awman/builtin-runtime", "awman-host-shims/builtin-runtime", "dep:microsandbox", "dep:microsandbox-cli", "dep:microsandbox-image", "dep:microsandbox-network", "dep:sqlx", "dep:msb_krun", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:hyper-rustls"]

[dependencies]
awman = { workspace = true }
awman-host-shims = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }
portable-pty = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
strip-ansi-escapes = { workspace = true }
strsim = { workspace = true }
tempfile = { workspace = true }
vt100 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true, features = ["stream", "blocking"] }
tokio-stream = { workspace = true }
unicode-width = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
sha2 = { workspace = true }
arboard = { workspace = true }
shell-words = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { workspace = true }
chrono = { workspace = true }
rcgen = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
which = { workspace = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper-rustls = { workspace = true, optional = true }

[build-dependencies]
sha2 = { workspace = true }
toml = { workspace = true }

[target.'cfg(any(all(target_os = "macos", target_arch = "aarch64"), all(target_os = "linux", target_env = "gnu", any(target_arch = "aarch64", target_arch = "x86_64"))))'.dependencies]
microsandbox = { workspace = true, optional = true }
microsandbox-cli = { workspace = true, optional = true }
microsandbox-image = { workspace = true, optional = true }
microsandbox-network = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
msb_krun = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process", "fs", "poll", "user"] }
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }
wiremock = { workspace = true }

# ── New architecture integration tests (WI 0073) ─────────────────────────────
# autotests = false suppresses the legacy tests/; these explicit entries
# target the new src/ API only.

[[test]]
name = "data_layer"
path = "../../tests/data_layer/main.rs"

[[test]]
name = "builtin_runtime"
path = "../../tests/builtin_runtime/main.rs"

[[test]]
name = "oci_import"
path = "../../tests/oci_import/main.rs"

[[test]]
name = "engine_tests"
path = "../../tests/engine/main.rs"

[[test]]
name = "command_tests"
path = "../../tests/command/main.rs"

[[test]]
name = "cli_parity"
path = "../../tests/cli_parity/main.rs"

[[test]]
name = "api_parity"
path = "../../tests/api_parity/main.rs"

[[test]]
name = "binary_smoke"
path = "../../tests/binary_smoke/main.rs"

# Real-guest driver for the `builtin_hw_*` tests (WI 0119). It must be its own
# executable: the embedded worker re-runs the current executable, and Cargo's
# test executables (in `deps/`) are refused as worker hosts. Built only with
# the builtin feature (`make test-builtin`).
[[example]]
name = "builtin_hw_driver"
path = "../../tests/builtin_runtime/hw_driver.rs"
required-features = ["builtin-runtime"]

[[example]]
name = "builtin_net_driver"
path = "../../tests/builtin_runtime/network_resources/driver.rs"
required-features = ["builtin-runtime"]

# ── WI 0101 squad test coverage (tests-squad step) ──────────────────────────────
# `autotests = false` above means top-level `tests/*.rs` files are NOT
# auto-discovered in this repo despite the usual Cargo convention; each needs
# its own explicit [[test]] entry or `cargo test` silently never builds it.

[[test]]
name = "squad_naming"
path = "../../tests/squad_naming.rs"

[[test]]
name = "squad_runtime_discovery"
path = "../../tests/squad_runtime_discovery.rs"

[[test]]
name = "squad_attach"
path = "../../tests/squad_attach.rs"

[[test]]
name = "squad_status_marker"
path = "../../tests/squad_status_marker.rs"

[[test]]
name = "squad_scheduler"
path = "../../tests/squad_scheduler.rs"

[[test]]
name = "squad_repair_loop"
path = "../../tests/squad_repair_loop.rs"

[[test]]
name = "squad_daemon_http"
path = "../../tests/squad_daemon_http.rs"

[[test]]
name = "squad_daemon_e2e"
path = "../../tests/squad_daemon_e2e.rs"

[[test]]
name = "squad_mutual_exclusion"
path = "../../tests/squad_mutual_exclusion.rs"

[[test]]
name = "squad_sandbox_refusal"
path = "../../tests/squad_sandbox_refusal.rs"

[[test]]
name = "squad_cli_gateway"
path = "../../tests/squad_cli_gateway.rs"

[[test]]
name = "squad_tui_tab"
path = "../../tests/squad_tui_tab.rs"

[[test]]
name = "squad_attach_frontends"
path = "../../tests/squad_attach_frontends.rs"

[[test]]
name = "squad_blockers"
path = "../../tests/squad_blockers.rs"

[[test]]
name = "squad_auth_key"
path = "../../tests/squad_auth_key.rs"

[[test]]
name = "squad_env_sync"
path = "../../tests/squad_env_sync.rs"

[[test]]
name = "squad_env_cli"
path = "../../tests/squad_env_cli.rs"

[[test]]
name = "squad_env_daemon"
path = "../../tests/squad_env_daemon.rs"

# WI 0114 tests-audit: this one still builds against the current API; the
# other thirteen unregistered `tests/*.rs` files reference the pre-WI-0072
# `oldsrc` surface (`awman::commands`, `awman::workflow`, `awman::tui`, …)
# and are recorded as dead in `40-tests-audit.md`.
[[test]]
name = "dockerfile_build"
path = "../../tests/dockerfile_build.rs"
