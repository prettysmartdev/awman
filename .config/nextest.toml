# Generated by cargo xtask gates render; edit ci/gates.toml.
nextest-version = "0.9.150"

[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "1s", terminate-after = 20 }

[profile.default.junit]
path = "junit.xml"

[test-groups.apple]
max-threads = 1

[test-groups.docker]
max-threads = 4

[test-groups.vm]
max-threads = 2

# artifact-deps-scan
[[profile.default.overrides]]
filter = "package(=awman-cli) & binary(=artifact) & (test(/^deps_scan::/))"
slow-timeout = { period = "1s", terminate-after = 300 }

